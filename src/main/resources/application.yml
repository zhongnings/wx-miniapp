server:
  port: 8081
  # 设置 HTTP 编码为 UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: yixinjr
  profiles:
    active: @profile.active@
  # 设置 HTTP 消息编码为 UTF-8
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 文件上传大小限制配置（Spring Boot 层面，必须配置，否则默认只有 1MB）
  servlet:
    multipart:
      max-file-size: 10MB        # 单个文件最大大小（与 file.max-file-size 保持一致）
      max-request-size: 20MB    # 整个请求最大大小（通常设置为 max-file-size 的 2 倍）
      enabled: true             # 启用 multipart 上传
    
  datasource:
    url: jdbc:mysql://localhost:3306/loan_miniapp?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: # 如果有密码请填写
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

rsa:
  public-key: 
  private-key: 

# 微信配置
wechat:
  appid: # 请配置微信小程序AppID
  secret: # 请配置微信小程序Secret